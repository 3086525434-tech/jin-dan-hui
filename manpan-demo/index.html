/* Three quiet diagrams explain the work; HTML carries all readable facts. */
.feature-tabs { position:relative; }
.feature-indicator {
  position:absolute; left:0; bottom:-1px; width:1px; height:2px;
  background:var(--ink); transform-origin:left center; opacity:0;
  transition:transform 200ms var(--ease); pointer-events:none;
}
.feature-tabs.indicator-ready .feature-indicator { opacity:1; }
.feature-tabs.indicator-ready button[aria-selected=true] { border-bottom-color:transparent; }
.feature-symbol { display:inline-flex; color:var(--violet-ink); }
.feature-symbol.orange { color:var(--orange-ink); }
.feature-symbol.gold { color:var(--gold-ink); }
.feature-panel[data-group=evidence] .feature-checks .icon { color:var(--orange-ink); }
.feature-panel[data-group=action] .feature-checks .icon { color:var(--gold-ink); }
.spot-stage {
  margin:0; min-width:0; min-height:430px; padding:26px 32px 24px;
  border-radius:12px; background:#f8f7fb; overflow:hidden;
  display:flex; flex-direction:column; justify-content:center; align-items:stretch;
}
.spot-stage[data-group=evidence] { background:#fcf9f5; }
.spot-stage[data-group=action] { background:#fbfaf4; }
.spot-art { width:240px; height:240px; margin:0 auto -14px; flex-shrink:0; }
.spot-art svg { display:block; width:100%; height:100%; }
.spot-readout { position:relative; width:100%; max-width:380px; margin:0 auto; }
.spot-readout h4 { font-size:16px; font-weight:600; letter-spacing:-.015em; line-height:1.6; }
.spot-facts { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:18px 0 0; }
.spot-facts div { min-width:0; }
.spot-facts dt { font-size:11px; color:var(--text-secondary); }
.spot-facts dd { margin:5px 0 0; font-size:24px; font-weight:600; line-height:1.4; font-variant-numeric:tabular-nums; }
.spot-facts small { font-size:11px; margin-left:4px; font-weight:400; color:var(--text-secondary); }
.spot-note { margin-top:18px; padding-top:14px; border-top:1px solid #dedbe6; color:var(--text-secondary); font-size:11px; line-height:1.8; }
.spot-stage[data-group=evidence] .spot-note { border-color:#e7ddd0; color:#76624b; }
.spot-stage[data-group=action] .spot-note { border-color:#e5e0cd; color:#72643c; }
.spot-evidence { margin-top:14px; }
.spot-evidence>div { display:flex; align-items:center; gap:9px; padding:9px 0; font-size:12px; color:#76624b; }

.spot-steps { padding:0; margin:18px 0 0; display:flex; align-items:center; list-style:none; }

.spot-steps li+li::before { content:''; width:14px; height:1px; background:#c4b994; margin:0 7px; }
.spot-steps .icon { width:16px; height:16px; color:var(--gold-ink); }

/* Selection retains the work group's meaning without tinting the whole page. */
.capability { position:relative; --cap-ink:var(--violet-ink); --cap-surface:#f5f1fb; --cap-edge:#c4afdf; }
.capability[data-tone=orange] { --cap-ink:var(--orange-ink); --cap-surface:#fdf5ed; --cap-edge:#d7b893; }
.capability[data-tone=gold] { --cap-ink:var(--gold-ink); --cap-surface:#faf7e9; --cap-edge:#cbbb86; }
.capability-icon,.capability-icon.orange,.capability-icon.gold {
  width:42px; height:42px; color:var(--cap-ink); background:var(--cap-surface); border:0;
}
.capability.selected { border-color:var(--cap-edge); background:#fff; box-shadow:inset 0 0 0 1px var(--cap-edge); }
.capability:hover { border-color:var(--cap-edge); background:#fdfcfe; }
.capability-name .icon { color:var(--cap-ink); }
.capability.selected .capability-name .icon { opacity:1; }
.capability-description { text-wrap:pretty; }
.btn,.composer-send { transition:background 180ms,color 180ms,border-color 180ms,transform 120ms var(--ease); }
.btn:active:not(:disabled),.composer-send:active:not(:disabled) { transform:translateY(1px); }
.btn .icon,.btn-link .icon,.capability-name .icon { transition:transform 180ms var(--ease),opacity 180ms; }
@media (hover:hover) and (pointer:fine) {
  .btn:hover .icon,.btn-link:hover .icon { transform:translateX(2px); }
  .capability:hover .capability-name .icon { transform:translate(1px,-1px); }
}
.suggestion strong,.message-content>strong { color:var(--ink); }
.suggestion>.icon { color:var(--violet-ink); }
.agent-intro h2 span { color:#85808d; }
.composer { transition:border-color 180ms; }
.composer:focus-within { border-color:var(--violet-ink); }
.composer-send { width:44px; height:44px; }
.composer-note { font-size:11px; }
.footer-disclosure { font-size:11px; }

/* Homepage icon feedback: one brief response to a deliberate interaction. */
@keyframes capability-sheen {
  0% { transform:translateX(-150%) skewX(-16deg); opacity:0; }
  20% { opacity:.85; }
  100% { transform:translateX(250%) skewX(-16deg); opacity:0; }
}
@keyframes capability-blink {
  0%,30%,100% { transform:scaleY(1); }
  45%,60% { transform:scaleY(.12); }
}
@media (prefers-reduced-motion:no-preference) {
  .home-content .capability { --icon-turn:-5deg; --icon-rise:-2px; }
  .home-content .capability[data-value=M01],.home-content .capability[data-value=M07] { --icon-turn:0deg; }
  .home-content .capability[data-value=M02] { --icon-turn:0deg; --icon-rise:-3px; }
  .home-content .capability[data-value=M04] { --icon-turn:0deg; }
  .home-content .capability[data-value=M06] { --icon-turn:-16deg; }
  .home-content .capability[data-value=M08] { --icon-turn:5deg; }
  .home-content .capability-icon { position:relative; overflow:hidden; isolation:isolate; transition:transform 160ms var(--ease); }
  .home-content .capability-icon::after {
    content:''; position:absolute; inset:-12px auto -12px 0; width:18px;
    background:linear-gradient(90deg,transparent,#ffffffb3,transparent);
    opacity:0; pointer-events:none;
  }
  .home-content .capability-icon>.icon { transition:transform 220ms var(--ease); transform-origin:center; }
  .home-content .capability[data-value=M04] .capability-icon .icon>path:last-child { transform-box:fill-box; transform-origin:center; }
  .home-content .capability:focus-visible .capability-icon>.icon { transform:translateY(var(--icon-rise)) rotate(var(--icon-turn)) scale(1.05); }
  .home-content .capability:focus-visible .capability-icon::after { animation:capability-sheen 420ms ease-out; }
  .home-content .capability[data-value=M04]:focus-visible .capability-icon .icon>path:last-child { animation:capability-blink 300ms ease-in-out; }
  .home-content .capability:active .capability-icon { transform:scale(.94); }
}
@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference) {
  .home-content .capability:hover .capability-icon>.icon { transform:translateY(var(--icon-rise)) rotate(var(--icon-turn)) scale(1.05); }
  .home-content .capability:hover .capability-icon::after { animation:capability-sheen 420ms ease-out; }
  .home-content .capability[data-value=M04]:hover .capability-icon .icon>path:last-child { animation:capability-blink 300ms ease-in-out; }
}

function validBusinessDay(value){
  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
  const time=Date.parse(value+'T00:00:00Z');
  return Number.isFinite(time)&&new Date(time).toISOString().slice(0,10)===value;
}
function requiredText(value,label,max=500){

}
function validateDataset(payload){

  const batch={id:requiredText(raw.id,'批次编号',128),source:requiredText(raw.source,'数据来源',500),channel:requiredText(raw.channel,'渠道',100),generatedAt:requiredText(raw.generatedAt,'生成时间',80),start:raw.start,end:raw.end,currency:raw.currency,grain:raw.grain,applicationsScope:raw.applicationsScope};

  if(!validBusinessDay(batch.start)||!validBusinessDay(batch.end)||batch.start>batch.end)fail('观察窗口无效。');
  if(batch.currency!=='CNY'||batch.grain!=='channel_day'||batch.applicationsScope!=='all_channel')fail('当前预览仅接受人民币、渠道日粒度及 APP 全渠道申请口径。');
  if(!Array.isArray(payload.daily)||payload.daily.length<1||payload.daily.length>3660)fail('日报应包含 1 至 3660 行。');
  const days=new Set();
  const daily=payload.daily.map(row=>{
    if(!row||!validBusinessDay(row.event_day)||row.event_day<batch.start||row.event_day>batch.end)fail('日报包含无效日期或超出观察窗口。');
    if(days.has(row.event_day))fail('同一渠道存在重复业务日，请先在来源端对账。');
    days.add(row.event_day);

  totals.cpc=totals.clicks?totals.cost/totals.clicks:null;

function transition(item, action, payload, at) {
  const c = JSON.parse(JSON.stringify(item)), reason = String(payload.reason || '').trim();
  if (!reason) throw new Error('请填写理由或记录内容。');
  let label;
  if (action === 'evidence') {
    if (c.status === '已关闭') throw new Error('请先重开案件再补充证据。');
    c.evidence.push({id:'LOCAL-'+(c.evidence.length+1),content:reason,reference:String(payload.reference||''),at});
    c.version += 1; c.status = '核验中'; label = '补充演示证据';
  } else if (action === 'review') {
    if (!['核验中','补证中','审查中'].includes(c.status)) throw new Error('当前阶段不能登记审查。');
    if (payload.verdict === '通过') {if(!c.evidence.length) throw new Error('请先补充至少一条证据，再登记演示审查。'); c.status='决策中';}
    else c.status='补证中';
    label='人工登记演示审查：'+payload.verdict;
  } else if (action === 'decision') {
    if(c.status!=='决策中') throw new Error('请先完成证据补录和审查登记。');
    c.status=payload.choice==='不采取动作'?'已关闭':'执行中';
    c.decision={choice:payload.choice,reason,at};label='业务决定：'+payload.choice;
  } else if (action === 'execution') {
    if(c.status!=='执行中') throw new Error('请先记录接受或修改建议的业务决定。');
    if(!String(payload.reference||'').trim() || !payload.date) throw new Error('请填写执行时间和凭证引用。');
    if(!Number.isFinite(Date.parse(payload.date))) throw new Error('执行时间无效。');
    if(Date.parse(payload.date)>Date.parse(at)) throw new Error('执行时间不能晚于当前时间。');
    c.execution={reason,reference:payload.reference,date:payload.date,at};c.status='回访中';label='登记演示执行凭证';
  } else if (action === 'followup') {
    if(c.status!=='回访中') throw new Error('请先登记执行凭证。');
    if(!payload.complete) throw new Error('请确认执行后的完整日报已经到齐。');
    c.status=payload.outcome==='问题持续，重新核验'?'核验中':'已关闭';c.followup={reason,outcome:payload.outcome,at};label='回访：'+payload.outcome;
  } else if (action === 'reopen') {
    if(c.status!=='已关闭') throw new Error('只有已关闭案件可以重开。');
    c.status='核验中';c.version+=1;label='重开演示案件';
  } else throw new Error('未知操作。');
  c.events.push({action,label,reason,at,reference:payload.reference||''});
  return c;
}

function metrics(rows=DATA.daily){const s=summary(rows);const list=[['渠道消耗',`<span class="currency">¥</span>${fmt(s.cost,2)}`,'feed CPC 消耗'],['累计点击',fmt(s.clicks),'feed CPC 点击'],['渠道申请',fmt(s.applications),'APP 全渠道 · 非同源'],['加权 CPC',`<span class="currency">¥</span>${fmt(s.cpc,2)}`,'总消耗 ÷ 总点击']];return `<div class="metric-grid">${list.map(([name,val,foot])=>`<article class="metric"><div class="metric-label">${name}</div><div class="metric-value mono">${val}</div><div class="metric-foot">${foot}</div></article>`).join('')}</div>`;}

function agentPage(){return `<div class="agent-layout"><header class="between agent-page-header"><div><h1>Agent 助理 <span class="badge outline agent-api-state">分析接口待接入</span></h1><p class="page-description">从数据到判断，每一步都有依据。</p></div>${state.messages.length?btn('新对话','new-chat','secondary','plus'):''}</header>${state.messages.length?'':`<section class="agent-intro"><div class="agent-symbol">${brandLogo()}</div><h2>一个好问题，<br><span>是清晰决策的开始。</span></h2><p>从渠道变化出发，串联证据与核验思路。</p></section><div class="suggestions">${[['trend','有哪些值得优先核验的线索？','梳理经营变化'],['chart','CPC 变化应该怎么看？','对照两类基线'],['database','当前数据还缺少什么？','检查证据完整性']].map(([i,q,sub])=>`<button class="suggestion" data-action="ask" data-question="${e(q)}">${icon(i)}<strong>${q}</strong><small>${sub}${icon('arrow')}</small></button>`).join('')}</div>`}<div id="messages" class="messages" aria-live="polite">${messagesMarkup()}</div><div class="composer-wrap"><form id="chat-form" class="composer"><label class="sr-only" for="chat-input">向演示 Agent 提问</label><textarea id="chat-input" name="question" autocomplete="off" placeholder="输入问题，例如：有哪些值得核验的变化…" maxlength="2000" rows="2" ${state.chatBusy?'disabled':''}></textarea><div class="composer-footer"><span class="composer-disclosure">${icon('database')}已载入 30 天渠道数据<span class="badge outline">本地演示</span></span><button class="composer-send" type="submit" aria-label="发送问题" ${state.chatBusy?'disabled':''}>${icon('arrowUp')}</button></div></form><p class="composer-note">回答使用附件数据与预设逻辑，未调用在线模型。Enter 发送，Shift + Enter 换行。</p></div></div>`;}

function renderPage(){return ({overview:overviewPage,cases:casesPage,agent:agentPage,replay:replayPage,data:dataPage,rules:rulesPage}[state.page])();}
function focusLocator(el){
 if(!el||el.nodeType!==1)return null;
 if(el.id)return {id:el.id};
 if(el.matches('.nav-item'))return {href:el.getAttribute('href')};
 if(el.dataset.action)return {action:el.dataset.action,value:el.dataset.value,idValue:el.dataset.id};
 return null;
}
function resolveFocus(locator,root=document){
 if(!locator)return null;
 if(locator.id)return document.getElementById(locator.id);
 if(locator.href)return $$('a[href]',root).find(el=>el.getAttribute('href')===locator.href);
 return $$('[data-action]',root).find(el=>el.dataset.action===locator.action&&(locator.value===undefined||el.dataset.value===locator.value)&&(locator.idValue===undefined||el.dataset.id===locator.idValue));
}
function render(){ cancelFeedback();const locator=$('#app').contains(document.activeElement)?focusLocator(document.activeElement):null;$('#app').innerHTML=shell();updateFeatureIndicator();updateInert();resolveFocus(locator)?.focus({preventScroll:true});if(state.page==='agent'&&state.messages.length)scrollMessages(); }
function navigate(page){if(!PAGE_NAMES[page])return;state.page=page;state.menu=false;stopReplay();closeModal(false);closeDrawer(false);if(location.hash!=='#'+page)location.hash=page;render();window.scrollTo({top:0});$('#main')?.focus({preventScroll:true});animateFeedback($('#main'),'page');}
function sparkline(key){const vals=DATA.daily.map(r=>Number(r[key]));const lo=Math.min(...vals),hi=Math.max(...vals);const points=vals.map((v,i)=>`${(i/(vals.length-1)*64).toFixed(1)},${(18-(v-lo)/(hi-lo||1)*15).toFixed(1)}`).join(' ');return `<svg class="sparkline" viewBox="0 0 64 21" aria-hidden="true"><polyline points="${points}" fill="none" stroke="#c6b7d5" stroke-width="1.3" stroke-linejoin="round"/></svg>`;}
const METRICS={cost_yuan:{label:'消耗',unit:'元',baseline:47819.43,format:n=>'¥'+fmt(n,2)},click:{label:'点击',unit:'次',baseline:20210,format:n=>fmt(n)+' 次'},apply_cnt:{label:'申请',unit:'笔',baseline:3141,format:n=>fmt(n)+' 笔'},conv:{label:'渠道 proxy',unit:'%',baseline:.15542,format:n=>fmt(n*100,2)+'%'}};
function chartData(){return DATA.daily.slice(-state.range);}
function chartCard(replay=false){return `<section class="card chart-card" aria-label="渠道趋势"><div class="card-head"><div><h2>${replay?'历史数据趋势':'渠道趋势'}</h2><p>CH-07-FEED <span class="chart-head-sub">· ${replay?'按业务日回看':'2026.10.06 – 11.04'}</span></p></div><div class="chart-controls">${replay?'<span class="replay-tag">历史数据回看</span>':`<div class="segmented" aria-label="趋势时间范围">${[30,14,7].map(n=>`<button data-action="range" data-value="${n}" aria-pressed="${state.range===n}">${n} 天</button>`).join('')}</div>`}</div></div><div class="chart-tabs" role="tablist" aria-label="趋势指标">${Object.entries(METRICS).map(([key,m])=>`<button role="tab" id="chart-tab-${key}" aria-controls="chart-region" tabindex="${state.metric===key?0:-1}" data-action="metric" data-value="${key}" aria-selected="${state.metric===key}">${m.label}</button>`).join('')}</div><div id="chart-region" role="tabpanel" aria-labelledby="chart-tab-${state.metric}">${chartMarkup(replay)}</div><div class="chart-caption"><div class="legend"><span><i></i>${METRICS[state.metric].label}</span><span><i class="dashed"></i>固定 7 日基线</span></div><button class="data-table-toggle" data-action="chart-table">${state.tableVisible?'收起数据':'查看数据'}</button></div>${state.tableVisible?dailyTable(chartData()):''}</section>`;}
function chartMarkup(replay=false){
 const rows=replay?DATA.daily:chartData(), m=METRICS[state.metric], vals=rows.map(r=>r[state.metric]), max=Math.max(...vals,m.baseline)*1.18, W=window.matchMedia('(max-width: 600px)').matches?360:720,H=198,L=49,R=16,T=15,B=28;
 const x=i=>L+i/(rows.length-1||1)*(W-L-R), y=v=>T+(1-v/max)*(H-T-B), pts=vals.map((v,i)=>[x(i),y(v)]), line=pts.map((p,i)=>(i?'L':'M')+p.map(n=>n.toFixed(2)).join(',')).join(' '), area=`${line} L${x(rows.length-1)},${H-B} L${L},${H-B}Z`;
 const point=replay?state.replayIndex:state.chartPoint, selected=Number.isInteger(point)?Math.min(rows.length-1,Math.max(0,point)):null;
 const scale=v=>state.metric==='conv'?fmt(v*100,0)+'%':v>=10000?fmt(v/10000,1)+'万':fmt(v,0);
 let ticks='';for(let i=0;i<4;i++){const v=max*i/3;ticks+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text text-anchor="end" x="${L-12}" y="${y(v)+3}">${scale(v)}</text>`;}
 const indices=[0,Math.round((rows.length-1)*.25),Math.round((rows.length-1)*.5),Math.round((rows.length-1)*.75),rows.length-1];
 const selection=selected===null?'':`<line x1="${x(selected)}" x2="${x(selected)}" y1="${T}" y2="${H-B}" stroke="#d7cadd" stroke-dasharray="3 4"/><circle cx="${x(selected)}" cy="${y(vals[selected])}" r="4" fill="#a48ab9" stroke="white" stroke-width="2"/>`;
 return `<div class="chart-wrap"><svg class="trend-svg" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="trend-title trend-desc"><title id="trend-title">${m.label}每日趋势</title><desc id="trend-desc">${rows[0].event_day} 至 ${rows.at(-1).event_day}的${m.label}。详细数值可通过查看数据按钮访问。</desc><defs><linearGradient id="area-fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#c3abd5" stop-opacity=".23"/><stop offset="100%" stop-color="#d5c5e1" stop-opacity=".01"/></linearGradient></defs>${ticks}<path d="${area}" fill="url(#area-fill)"/><line class="baseline-line" x1="${L}" x2="${W-R}" y1="${y(m.baseline)}" y2="${y(m.baseline)}"/><path class="trend-line" d="${line}"/>${selection}${indices.map(i=>`<text text-anchor="middle" x="${x(i)}" y="${H-5}">${rows[i].event_day.slice(5).replace('-','.')}</text>`).join('')}${rows.map((r,i)=>`<rect x="${x(i)-(W-L-R)/rows.length/2}" y="${T}" width="${(W-L-R)/rows.length}" height="${H-T-B}" fill="transparent" data-chart-point="${i}" aria-hidden="true"/>`).join('')}</svg></div>${selected!==null?`<div class="chart-detail" aria-live="polite"><span class="mono">${rows[selected].event_day}</span><strong class="mono">${m.format(vals[selected])}</strong><button class="icon-btn" data-action="point-close" aria-label="收起数据提示">${icon('x','sm')}</button></div>`:''}`;
}

function dailyTable(rows){return `<div class="table-wrap"><table class="table"><caption class="sr-only">来源：取数整合_脱敏版.xlsx / 渠道规则。金额为元，proxy 为渠道近似指标。</caption><thead><tr><th>业务日</th><th>消耗 / 元</th><th>点击 / 次</th><th>申请 / 笔</th><th>渠道 proxy</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono">${r.event_day}</td><td class="mono">${fmt(r.cost_yuan,2)}</td><td class="mono">${fmt(r.click)}</td><td class="mono">${fmt(r.apply_cnt)}</td><td class="mono">${fmt(r.apply_cnt/r.click*100,2)}%</td></tr>`).join('')}</tbody></table></div>`;}
function attentionCard(){return `<section class="card attention-card"><div class="card-head"><div><h2>值得优先核验</h2><p>从变化出发，逐一寻找证据</p></div><span class="badge lavender">3 条线索</span></div><div class="attention-list">${[

function messagesMarkup(){return state.messages.map(m=>{if(m.role==='user')return `<article class="message user"><div class="message-content">${e(m.text).replace(/\n/g,'<br>')}</div><div class="message-avatar">岳</div></article>`;const answer=answerFor(m.text,DATA);return `<article class="message"><div class="message-avatar">${icon('spark')}</div><div class="message-content"><span class="badge outline">本地数据解读 · 演示</span><br><strong>${e(answer.title)}</strong>${answer.paragraphs.map(p=>`<p>${e(p)}</p>`).join('')}<div class="message-source"><span>${icon('file','sm').replace('class="icon','style="display:inline-block;vertical-align:middle;margin-right:4px" class="icon')}来源：${e(answer.source)}</span>${answer.kind?`<button class="btn-link" data-action="open-kind" data-value="${answer.kind}">查看核验示例${icon('arrow')}</button>`:''}</div></div></article>`;}).join('')+(state.chatBusy?`<article class="message"><div class="message-avatar">${icon('spark')}</div><div class="message-content typing"><i></i><i></i><i></i><span style="margin-left:5px">正在读取已导入数据…</span></div></article>`:'');}

function refreshConnections(){const region=$('#integration-region');if(!region)return;const locator=focusLocator(document.activeElement);region.outerHTML=integrationPanel();resolveFocus(locator)?.focus({preventScroll:true});}
async function checkConnections(){
 if(state.connectionBusy)return;state.connectionBusy=true;
 for(const key of ['data','agent'])if(apiClient.enabled[key])state.connections[key]={state:'checking',message:'正在检查接口…'};
 refreshConnections();
 try{state.connections=await apiClient.status();state.connectionCheckedAt=now();}
 finally{state.connectionBusy=false;refreshConnections();}
}
async function previewLiveData(){

 finally{state.previewLoading=false;refreshConnections();}
}

/p></div></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>运行 ID</th><th>启动时间</th><th>范围</th><th>参数</th><th>结果</th></tr></thead><tbody>${state.runs.length?state.runs.map(r=>`<tr><td class="mono">${e(r.id)}</td><td class="mono">${humanTime(r.at)}</td><td>CH-07 · 30 天</td><td class="mono">raw7 / fixed7</td><td><span class="badge">演示完成 · 3 条线索</span></td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">'+icon('history')+'<h3>还没有运行记录</h3><p>可启动一次演示，了解从数据检查到线索整理的过程。</p>'+btn('运行演示','run','secondary','play')+'</div></td></tr>'}</tbody></table></div></div><div class="section-heading"><div><h2>源文件校验摘要</h2><p>保留工作簿中的校验结论，差异不自动放行。</p></div><button class="btn-link" data-action="source-checks">查看全部 ${DATA.checks.length} 项${icon('arrow')}</button></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>校验项</th><th>实测</th><th>来源结论</th></tr></thead><tbody>${DATA.checks.slice(0,6).map(r=>`<tr><td>${e(r['校验项'])}</td><td class="mono">${e(r['实测'])}</td><td><span class="badge">${e(r['结论'])}</span></td></tr>`).join('')}</tbody></table></div></div>${footer()}`;}

div><div class="list-row"><div class="list-row-icon">${icon('shield')}</div><div class="list-row-copy"><strong>建议、决定与执行分开</strong><small>Agent 提建议，业务负责人判断，凭证确认执行。</small></div></div><div class="list-row"><div class="list-row-icon">${icon('wallet')}</div><div class="list-row-copy"><strong>消耗与收益分开</strong><small>未完成可比性审查，不确认节省或收益。</small></div></div></section></div></div>${footer()}`;}

function currentCase(){return state.cases.find(c=>c.id===state.drawer);}
function openCase(id){if(!state.cases.some(c=>c.id===id))return;focusBeforeOverlay=document.activeElement;drawerOpenerLocator=focusLocator(document.activeElement);state.drawer=id;state.drawerTab='analysis';renderDrawer();}
function closeDrawer(restore=true){state.drawer=null;$('#drawer-root').innerHTML='';updateInert();if(restore)(focusBeforeOverlay?.isConnected?focusBeforeOverlay:resolveFocus(drawerOpenerLocator)||$('#main'))?.focus({preventScroll:true});}
function renderDrawer(focus=true){const c=currentCase();if(!c)return;const facts=factsFor(c.kind,DATA);$('#drawer-root').innerHTML=`<div class="overlay" data-dismiss="drawer"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1"><div class="drawer-head"><div class="drawer-topline"><span class="mono">${c.id} &nbsp; / &nbsp; 流程演示</span><div class="flex"><span class="badge outline">V${c.version}.0</span><button class="icon-btn" data-action="drawer-close" aria-label="关闭案件详情">${icon('x')}</button></div></div><h2 id="drawer-title">${e(c.title)}</h2><div class="drawer-meta"><span>${e(c.scope)}</span><span>线索日 ${c.day}</span><span>负责人 ${e(c.owner)}</span>${statusBadge(c.status)}</div></div><div class="drawer-tabs" role="tablist" aria-label="案件详情内容">${[['analysis','分析与证据'],['timeline','事件时间线'],['decision','决定与回访']].map(([key,label])=>`<button role="tab" id="drawer-tab-${key}" aria-controls="drawer-tab-panel" tabindex="${state.drawerTab===key?0:-1}" data-action="drawer-tab" data-value="${key}" aria-selected="${state.drawerTab===key}" class="${state.drawerTab===key?'active':''}">${label}</button>`).join('')}</div><div class="drawer-body" id="drawer-tab-panel" role="tabpanel" aria-labelledby="drawer-tab-${state.drawerTab}">${state.drawerTab==='analysis'?drawerAnalysis(c,facts):state.drawerTab==='timeline'?drawerTimeline(c):drawerDecision(c)}</div><div class="drawer-footer"><small>流程与新增记录仅用于本地演示</small><div class="flex">${btn('查看来源','case-source','secondary','file')}${c.status==='已关闭'?btn('重开案件','case-form-reopen','primary','refresh'):btn('补充证据','case-form-evidence','primary','plus')}</div></div></section></div>`;updateInert();if(focus)$('.drawer [data-action="drawer-close"]')?.focus({preventScroll:true});}
function drawerAnalysis(c,facts){return `<div class="note neutral">${icon('info')}数值来自附件；以下假设与建议为预设流程示例，未调用在线模型，也未经独立 Agent 审查。</div><section class="drawer-section spaced"><h3>${icon('chart')}已知事实</h3><p class="fact-title">${e(facts.title)}</p><div class="fact-grid">${facts.rows.map(([label,val])=>`<div class="fact-cell"><small>${e(label)}</small><strong class="mono">${e(val)}</strong></div>`).join('')}</div><div class="fact-source">${icon('file')}来源：${e(facts.source)}</div></section><div class="note spaced">${icon('shield')}${e(facts.caveat)}</div><section class="drawer-section spaced"><h3>${icon('spark')}待验证的假设<span class="badge outline">演示示例</span></h3>${c.kind==='snapshot'?`<div class="hypothesis"><h4>01 / 历史属性可能被直接复用</h4><p><span>支持：</span>源表出现 6 处相同指纹引用。</p><p><span>尚缺：</span>完整属性逐行比对结果与来源可见时间。</p><p><span>排除条件：</span>逐行比对一致且在观察时点可见，可按规则复用。</p></div>`:`<div class="hypothesis"><h4>01 / 流量结构或计费来源发生变化</h4><p><span>支持：</span>渠道汇总比值发生变化，单元明细尚不足。</p><p><span>反证：</span>暂无单元结构与其他计费来源明细，无法排除。</p><p><span>核验：</span>对齐同一时间窗的账户、单元与计费构成。</p></div><div class="hypothesis"><h4>02 / 页面或跳转可能存在异常</h4><p><span>支持：</span>当前没有直接支持该原因的复现证据。</p><p><span>尚缺：</span>发布时间、变更日志、人工复现与截图。</p><p><span>排除条件：</span>同对象同环境复现正常，且其他因素解释变化。</p></div>`}</section><section class="drawer-section"><h3>${icon('link')}补录证据 <span class="badge outline">${c.evidence.length} 条本地记录</span></h3>${c.evidence.length?c.evidence.map(v=>`<div class="evidence-card"><small class="mono">${e(v.id)} · ${humanTime(v.at)} · 人工补录 / 演示</small><p>${e(v.content)}</p>${v.reference?`<div class="reference">引用：${e(v.reference)}</div>`:''}</div>`).join(''):'<p>尚未补录。可添加核验结果和凭证引用，再登记演示审查。</p>'}</section><section class="drawer-section"><h3>${icon('arrow')}建议下一步</h3><p>${c.kind==='snapshot'?'请数据维护角色提供完整属性比对报告，核对可见时间与回退分区，在凭证齐全后重新运行。':'请数据分析师对齐对象范围与变更时间，完成同对象人工复现。证据补齐后再审查行动前提，由业务负责人决定是否处置。'}</p></section>`;}
function drawerTimeline(c){return `<div class="note neutral">${icon('history')}所有时间线事件均为本地演示记录。源数据的业务日与本页操作时间分别保留。</div><div class="timeline spaced"><article class="timeline-event"><strong>载入核验流程示例</strong><small>业务线索日 ${c.day} · 初始示例</small><p>引用脱敏文件中的${c.kind==='snapshot'?'重复分区摘要':'渠道汇总'}，建立核验事项；并非已确认真实案件。</p></article>${c.events.map(v=>`<article class="timeline-event"><strong>${e(v.label)}</strong><small>${humanTime(v.at)} · 演示身份 岳悦</small><p>${e(v.reason)}</p>${v.reference?`<p>凭证引用：${e(v.reference)}</p>`:''}</article>`).join('')}</div>${c.events.length?'':'<p class="muted" style="font-size:12px">完成补证、审查、决定或回访后，事件会追加保存在这里。</p>'}`;}
function drawerDecision(c){return `<div class="stage-track">${STAGES.map(s=>`<div class="${c.status===s?'current':''}">${s}</div>`).join('')}</div><div class="note">${icon('shield')}接受建议只记录业务决定。登记实际执行必须提供时间与凭证；完整执行后日报到齐后，才进入回访确认。</div><section class="drawer-section spaced"><h3>01 / 人工审查登记</h3><p>用于演示审查结果的记录方式。此操作不会调用独立审查 Agent，也不验证凭证真实性。</p><div class="decision-actions spaced">${btn('登记审查','case-form-review','secondary','shield',!['核验中','补证中','审查中'].includes(c.status)?'disabled':'')}${c.status==='决策中'?'<span class="badge lavender">已登记演示审查通过</span>':''}</div></section><section class="drawer-section"><h3>02 / 业务决定</h3>${c.decision?`<div class="hypothesis"><h4>${e(c.decision.choice)} · ${humanTime(c.decision.at)}</h4><p>${e(c.decision.reason)}</p></div>`:'<p>负责人明确接受、修改或不采取动作，并填写理由。</p>'}<div class="decision-actions spaced">${btn('记录业务决定','case-form-decision','secondary','file',c.status!=='决策中'?'disabled':'')}</div></section><section class="drawer-section"><h3>03 / 执行登记</h3>${c.execution?`<div class="hypothesis"><h4>执行记录已登记 · 演示</h4><p>执行时间：${humanTime(c.execution.date)}</p><p>${e(c.execution.reason)}</p><p>凭证：${e(c.execution.reference)}</p></div>`:'<p>接受后通过原有业务路径执行。这里只登记实际动作和凭证，不修改投放配置。</p>'}<div class="decision-actions spaced">${btn('登记执行与凭证','case-form-execution','secondary','link',c.status!=='执行中'?'disabled':'')}</div></section><section class="drawer-section"><h3>04 / 回访确认</h3>${c.followup?`<div class="hypothesis"><h4>${e(c.followup.outcome)} · ${humanTime(c.followup.at)}</h4><p>${e(c.followup.reason)}</p></div>`:'<p>检查同范围完整日报，区分观察变化和经验证收益；问题持续时重新核验。</p>'}<div class="decision-actions spaced">${btn('记录回访','case-form-followup','secondary','history',c.status!=='回访中'?'disabled':'')}</div></section>`;}

function updateInert(){const overlay=!!(state.drawer||state.modal);$('#app').inert=overlay;$('#drawer-root').inert=!!state.modal;document.body.style.overflow=overlay||state.menu?'hidden':'';}
function showModal(title,body,footerHTML='',wide=false,kind='info'){
 if(!state.modal){focusBeforeModal=document.activeElement;modalOpenerLocator=focusLocator(document.activeElement);}state.modal=kind;
 $('#modal-root').innerHTML=`<div class="modal-overlay" data-dismiss="modal"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><header class="modal-head"><h2 id="modal-title">${e(title)}</h2><button class="icon-btn" data-action="modal-close" aria-label="关闭弹窗">${icon('x')}</button></header><div class="modal-body">${body}</div>${footerHTML?`<footer class="modal-footer">${footerHTML}</footer>`:''}</section></div>`;
 updateInert();setTimeout(()=>($('.modal input:not([type=checkbox]),.modal textarea')||$('.modal [data-action="modal-close"]'))?.focus({preventScroll:true}),0);
}
function closeModal(restore=true){if(state.runActive)return;state.modal=null;$('#modal-root').innerHTML='';updateInert();if(restore)(focusBeforeModal?.isConnected?focusBeforeModal:resolveFocus(modalOpenerLocator)||$('.drawer [data-action=drawer-close]')||$('#main'))?.focus({preventScroll:true});}
function toast(message){clearTimeout(toastTimer);$('#toast-root').innerHTML=`<div class="toast">${icon('checkCircle')}<span>${e(message)}</span></div>`;toastTimer=setTimeout(()=>{$('#toast-root').innerHTML='';},4200);}
function caseForm(action){const c=currentCase();if(!c)return;const labels={evidence:'补充证据',review:'登记演示审查',decision:'记录业务决定',execution:'登记执行与凭证',followup:'记录回访',reopen:'重开案件'};let body=`<div class="note neutral">${icon('info')}本地演示记录，不写入飞书或投放系统。所有新增记录均标记为演示。</div><form id="case-form" autocomplete="off" data-kind="${action}">`;
 if(action==='evidence')body+=`<label class="field"><span>核验结果或证据内容 <span aria-hidden="true">*</span></span><textarea name="reason" required maxlength="5000" placeholder="说明检查对象、方法、结果，以及支持或排除什么判断。"></textarea></label><label class="field"><span>凭证引用（可选）</span><input name="reference" maxlength="1000" placeholder="例如：文档编号、工单或链接…"><small>只保存文字引用，不上传文件，也不自动访问链接。</small></label>`;
 if(action==='review')body+=`<label class="field"><span>人工登记的审查结果</span><select name="verdict"><option>退回补证</option><option>通过</option></select></label><label class="field"><span>审查理由与证据引用 *</span><textarea name="reason" required maxlength="5000" placeholder="说明证据、口径、可见时间及行动前提是否满足。"></textarea></label><p class="fine">登记通过前，至少需要一条补录证据。本地演示不代替独立 Agent 审查。</p>`;
 if(action==='decision')body+=`<label class="field"><span>业务决定</span><select name="choice"><option>接受建议</option><option>修改后接受</option><option>不采取动作</option></select></label><label class="field"><span>决定理由 / 适用前提 *</span><textarea name="reason" required maxlength="5000" placeholder="写明决定、动作范围、执行角色与理由。"></textarea></label>`;
 if(action==='execution')body+=`<label class="field"><span>实际执行时间 *</span><input name="date" type="datetime-local" required><small>按北京时间记录；不能填写未来时间。</small></label><label class="field"><span>实际动作 *</span><textarea name="reason" required maxlength="5000" placeholder="记录实际执行的动作、对象与操作者。"></textarea></label><label class="field"><span>执行凭证引用 *</span><input name="reference" required maxlength="1000" placeholder="例如：原有平台操作记录或工单编号…"></label>`;
 if(action==='followup')body+=`<label class="checkbox-line"><input name="complete" type="checkbox" required><span>已取得执行后的首个完整日报，并完成同范围对照。</span></label><label class="field"><span>回访结果</span><select name="outcome"><option>已完成核验，关闭案件</option><option>问题持续，重新核验</option></select></label><label class="field"><span>回访结论与证据 *</span><textarea name="reason" required maxlength="5000" placeholder="说明执行前后表现、可比性限制和业务结论；不要将观察差异直接写为收益。"></textarea></label>`;
 if(action==='reopen')body+=`<label class="field"><span>重开理由与新线索 *</span><textarea name="reason" required maxlength="5000" placeholder="说明新证据或复发情况。"></textarea></label>`;
 body+='<div id="form-error" class="form-error" role="alert" tabindex="-1"></div></form>';
 showModal(labels[action],body,btn('取消','modal-close','secondary')+`<button class="btn btn-primary" type="submit" form="case-form">保存演示记录${icon('check')}</button>`,false,'case-form');
}
function submitCase(form){const c=currentCase();if(!c)return;const data=Object.fromEntries(new FormData(form));data.complete=!!form.elements.complete?.checked;if(data.date)data.date+=':00+08:00';try{const next=transition(c,form.dataset.kind,data,now());state.cases=state.cases.map(v=>v.id===next.id?next:v);save();closeModal(false);render();renderDrawer(false);$('.drawer [data-action="drawer-close"]')?.focus({preventScroll:true});toast('演示记录已保存 · 当前阶段：'+next.status);}catch(err){$('#form-error').textContent=err.message;$('#form-error').focus();}}
function about(){showModal('关于这个演示',`<div class="flex" style="margin-bottom:18px"><span class="brand-mark">${icon('mark','lg')}</span><div><strong style="font-size:15px;color:#75627f">满盘有数</strong><div class="fine">渠道经营决策工作台 · PRD V1.7</div></div></div><p>使用上传的脱敏工作簿，呈现从渠道变化到案件核验、业务决定与回访的交互流程。</p><ul class="about-list"><li>消耗、点击、申请及趋势使用附件实值。</li><li>案件、假设和流程状态为预设交互示例，页面操作只保存在当前浏览器。</li><li>Agent 使用本地数据和预设逻辑，未连接在线模型、飞书、Claw 或投放系统。</li><li>网站可通过链接分享；新增演示记录只保存在各自浏览器，不会同步。</li><li>真实数据与分析接口待接入，当前没有生产权限隔离或正式审计。</li><li>未确认真实故障、已验证收益或提前发现天数。</li></ul>`,btn('开始体验','modal-close','primary'));}

const motionPreference=window.matchMedia('(prefers-reduced-motion: reduce)');
const activeFeedback=new Set();
function cancelFeedback(){for(const animation of activeFeedback)animation.cancel();activeFeedback.clear();}
function animateFeedback(element,kind='detail'){
 if(!element?.animate||document.hidden)return;
 const reduced=motionPreference.matches;
 const keyframes=reduced||kind==='page'?[{opacity:.78},{opacity:1}]:[{opacity:.65,transform:'translateX(6px)'},{opacity:1,transform:'translateX(0)'}];
 const animation=element.animate(keyframes,{duration:reduced?100:kind==='page'?160:200,easing:'cubic-bezier(.16,1,.3,1)'});
 activeFeedback.add(animation);
 animation.finished.then(()=>activeFeedback.delete(animation),()=>activeFeedback.delete(animation));
}
motionPreference.addEventListener('change',cancelFeedback);
function motionBehavior(){return motionPreference.matches?'instant':'smooth';}
function updateFeatureIndicator(){
 const tabs=$('.feature-tabs'),active=$('.feature-tabs [aria-selected="true"]'),indicator=$('.feature-indicator');
 if(!tabs||!active||!indicator)return;
 const width=active.offsetWidth,left=active.offsetLeft;
 if(!width)return; // A readable border remains when layout measurements are unavailable.
 indicator.style.transform=`translateX(${left}px) scaleX(${width})`;
 tabs.classList.add('indicator-ready');
}
let indicatorFrame=0;
window.addEventListener('resize',()=>{cancelAnimationFrame(indicatorFrame);indicatorFrame=requestAnimationFrame(updateFeatureIndicator);});
document.fonts?.ready.then(updateFeatureIndicator);

 for(const card of $$('.capability')){const selected=card.dataset.value===id;card.classList.toggle('selected',selected);card.setAttribute('aria-pressed',String(selected));}
 for(const tab of $$('.feature-tabs [role="tab"]')){const selected=tab.dataset.value===cap.group;tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;}
 const panel=$('#feature-panel');
 if(panel&&changed){cancelFeedback();panel.innerHTML=featureDetail();panel.dataset.group=cap.group;panel.setAttribute('aria-labelledby','feature-tab-'+cap.group);animateFeedback(panel);}
 updateFeatureIndicator();

 if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(!state.modal&&!state.drawer)searchModal();return;}
 if(event.key==='?'&&!editing&&!state.modal&&!state.drawer){event.preventDefault();help();return;}
 if(event.target.id==='chat-input'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();ask(event.target.value);return;}
 if(event.key==='Tab'&&(state.modal||state.drawer||state.menu)){const root=state.modal?$('.modal'):state.drawer?$('.drawer'):$('.primary-nav');const focusable=$$('a[href],button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),summary,[tabindex="0"]',root).filter(el=>!el.hidden);if(!focusable.length)return;const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&(document.activeElement===first||!root.contains(document.activeElement))){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||!root.contains(document.activeElement))){event.preventDefault();first.focus();}}
});
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(PAGE_NAMES[page]&&page!==state.page)navigate(page);});
const mobileNavigation=window.matchMedia('(max-width: 860px)');
mobileNavigation.addEventListener('change',event=>{if(!event.matches&&state.menu){state.menu=false;render();}});
const compactCharts=window.matchMedia('(max-width: 600px)');
compactCharts.addEventListener('change',()=>{if(state.page==='overview'||state.page==='replay')refreshChart();});
window.addEventListener('beforeunload',stopReplay);
render();
